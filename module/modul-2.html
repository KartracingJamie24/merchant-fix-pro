<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modul 2 – Shopify Integration | MerchantFIX Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 11pt;
      color: #1a1a1a;
      background: #f0f4f8;
      line-height: 1.7;
    }
    .page-wrapper {
      max-width: 900px;
      margin: 30px auto;
      background: #fff;
      padding: 50px 60px;
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.08);
    }
    .top-nav {
      background: #1a73e8;
      padding: 12px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-nav .logo {
      color: white;
      font-weight: 900;
      font-size: 14pt;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 20px; }
    .nav-links a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 10pt;
      font-weight: 600;
    }
    .nav-links a.active { color: white; border-bottom: 2px solid white; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #1a73e8;
      padding-bottom: 16px;
      margin-bottom: 40px;
    }
    .header-logo { font-size: 18pt; font-weight: 900; color: #1a73e8; }
    .header-info { text-align: right; font-size: 9pt; color: #888; }
    .progress-bar-wrapper {
      background: #e8f0fe;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 35px;
      border: 1px solid #c5d8ff;
    }
    .progress-label { font-size: 9pt; color: #555; margin-bottom: 8px; font-weight: 600; }
    .progress-track { background: #d0deff; border-radius: 10px; height: 12px; width: 100%; }
    .progress-fill {
      background: linear-gradient(90deg, #1a73e8, #4285f4);
      height: 12px;
      border-radius: 10px;
      width: 33.3%;
    }
    .progress-steps { display: flex; justify-content: space-between; margin-top: 8px; }
    .progress-steps span { font-size: 8pt; color: #888; }
    .progress-steps span.done { color: #1a73e8; font-weight: 700; }
    .title-page {
      text-align: center;
      padding: 50px 30px 60px;
      background: linear-gradient(135deg, #f0f4ff, #e8f0fe);
      border-radius: 16px;
      border: 2px solid #1a73e8;
      margin-bottom: 50px;
    }
    .kurs-badge {
      display: inline-block;
      background: #1a73e8;
      color: white;
      padding: 7px 22px;
      border-radius: 25px;
      font-size: 9pt;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .modul-label { font-size: 13pt; color: #1a73e8; font-weight: 700; margin-bottom: 10px; }
    .title-page h1 {
      font-size: 30pt;
      font-weight: 900;
      color: #1a1a1a;
      line-height: 1.2;
      margin-bottom: 12px;
      border: none;
      padding: 0;
    }
    .title-divider {
      width: 80px; height: 4px;
      background: #1a73e8;
      margin: 20px auto;
      border-radius: 2px;
    }
    .title-subtitle { font-size: 13pt; color: #555; margin-bottom: 20px; }
    .title-desc { font-size: 11pt; color: #666; max-width: 580px; margin: 0 auto 25px; }
    .title-meta { font-size: 9pt; color: #999; }
    .toc {
      background: #f8f9ff;
      border-left: 6px solid #1a73e8;
      border-radius: 10px;
      padding: 28px 35px;
      margin-bottom: 50px;
    }
    .toc h2 { font-size: 14pt; color: #1a73e8; margin-bottom: 18px; font-weight: 800; border: none; }
    .toc-list { list-style: none; }
    .toc-list > li {
      font-size: 11pt;
      color: #333;
      margin-bottom: 10px;
      padding: 10px 16px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e0e8ff;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .toc-list > li a { color: #1a73e8; text-decoration: none; font-weight: 600; }
    h1 {
      font-size: 24pt;
      font-weight: 900;
      color: #1a1a1a;
      margin-top: 50px;
      margin-bottom: 16px;
      border-bottom: 3px solid #1a73e8;
      padding-bottom: 10px;
    }
    h2 { font-size: 16pt; font-weight: 800; color: #1a73e8; margin-top: 35px; margin-bottom: 14px; }
    h3 { font-size: 13pt; font-weight: 700; color: #333; margin-top: 22px; margin-bottom: 10px; }
    p { font-size: 11pt; margin-bottom: 14px; color: #333; }
    ul { margin-left: 22px; margin-bottom: 16px; }
    ul li { font-size: 11pt; margin-bottom: 7px; color: #333; }
    ol { margin-left: 22px; margin-bottom: 16px; }
    ol li { font-size: 11pt; margin-bottom: 9px; color: #333; }
    code {
      background: #f0f4ff;
      color: #1a73e8;
      padding: 2px 7px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 10pt;
    }
    .info-box {
      background: #e8f4fd;
      border-left: 5px solid #1a73e8;
      border-radius: 8px;
      padding: 16px 20px;
      margin: 20px 0;
    }
    .info-box strong { color: #1a73e8; }
    .tipp-box {
      background: #f0fff4;
      border-left: 5px solid #38a169;
      border-radius: 8px;
      padding: 16px 20px;
      margin: 20px 0;
    }
    .tipp-box strong { color: #38a169; }
    .warn-box {
      background: #fffbeb;
      border-left: 5px solid #d69e2e;
      border-radius: 8px;
      padding: 16px 20px;
      margin: 20px 0;
    }
    .warn-box strong { color: #d69e2e; }
    .error-box {
      background: #fff5f5;
      border-left: 5px solid #e53e3e;
      border-radius: 8px;
      padding: 16px 20px;
      margin: 20px 0;
    }
    .error-box strong { color: #e53e3e; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 10pt; }
    table th { background: #1a73e8; color: white; padding: 11px 15px; text-align: left; font-weight: 700; }
    table td { padding: 10px 15px; border-bottom: 1px solid #e8e8e8; vertical-align: top; }
    table tr:nth-child(even) td { background: #f8f9ff; }
    table tr:hover td { background: #e8f0fe; }
    .schritt-card {
      background: #f8f9ff;
      border: 1px solid #dde4ff;
      border-radius: 12px;
      padding: 22px 26px;
      margin-bottom: 18px;
    }
    .schritt-header { display: flex; align-items: center; margin-bottom: 14px; gap: 14px; }
    .schritt-nummer {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1a73e8;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-weight: 900;
      font-size: 13pt;
      flex-shrink: 0;
    }
    .schritt-title { font-size: 13pt; font-weight: 700; color: #1a1a1a; }
    .checkliste {
      background: #f0fff4;
      border: 2px solid #38a169;
      border-radius: 12px;
      padding: 28px 35px;
      margin: 40px 0;
    }
    .checkliste h2 { color: #38a169; font-size: 16pt; margin-bottom: 22px; border: none; }
    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 14px;
      padding: 12px 16px;
      background: white;
      border: 1px solid #c6f6d5;
      border-radius: 8px;
    }
    .check-box {
      width: 22px; height: 22px;
      border: 2px solid #38a169;
      border-radius: 5px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .check-text { font-size: 11pt; color: #333; }
    .check-text strong { color: #1a1a1a; }
    .check-text small { display: block; color: #888; font-size: 9pt; margin-top: 3px; }
    .modul-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 60px;
      padding-top: 25px;
      border-top: 2px solid #e0e0e0;
    }
    .btn-nav {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1a73e8;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 11pt;
    }
    .btn-nav:hover { background: #1557b0; }
    .btn-nav.secondary {
      background: white;
      color: #1a73e8;
      border: 2px solid #1a73e8;
    }
    .footer {
      border-top: 2px solid #1a73e8;
      padding-top: 14px;
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 9pt;
      color: #888;
    }
    .footer a { color: #1a73e8; text-decoration: none; }
    @media print {
      body { background: white; }
      .top-nav, .modul-nav { display: none; }
      .page-wrapper { box-shadow: none; padding: 20px; }
    }
    @media (max-width: 700px) {
      .page-wrapper { padding: 25px 20px; margin: 10px; }
      .nav-links { display: none; }
    }
  </style>
</head>
